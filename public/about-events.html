<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Events - Symposium 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:  #00c6ff;
      --accent:   #00ffae;
      --tech:     #4f8ef7;
      --nontech:  #a855f7;
      --warn:     #fbbf24;
      --bg:       #0a1520;
      --surface:  rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.07);
      --text:     #e8f0f8;
      --muted:    #5a7080;
      --label:    #8899a8;
      --ease:     cubic-bezier(0.23, 1, 0.32, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 72px;
    }

    /* ── ANIMATED BG ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(0,198,255,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 80%, rgba(168,85,247,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(10,21,32,1) 0%, rgba(7,14,24,1) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAVBAR ── */
    .navbar {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 72px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 1000;
      background: rgba(10,21,32,0.8);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      transition: opacity 0.4s;
    }

    .logo span { color: var(--primary); }
    .logo.loading { opacity: 0.4; }

    .menu-toggle { cursor: pointer; flex-shrink: 0; }
    .bar { width: 22px; height: 2px; background: var(--primary); margin: 5px 0; transition: 0.35s var(--ease); border-radius: 2px; }
    .menu-toggle.open .bar:nth-child(1) { transform: rotate(-45deg) translate(-5px, 6px); background: #fff; }
    .menu-toggle.open .bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .menu-toggle.open .bar:nth-child(3) { transform: rotate(45deg) translate(-5px, -6px); background: #fff; }

    /* ── SIDE MENU ── */
    .nav-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 280px; height: 100vh;
      background: #060e16;
      border-right: 1px solid rgba(0,198,255,0.15);
      transform: translateX(-100%);
      transition: transform 0.4s var(--ease);
      z-index: 999;
    }

    .nav-overlay.open { transform: translateX(0); }

    .overlay-content {
      padding: 100px 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 12px;
      display: block;
      transition: background 0.2s;
    }

    .nav-item:hover, .nav-item.active { background: rgba(0,198,255,0.06); }

    .nav-number {
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--primary);
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
    }

    .nav-text {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--label);
      transition: color 0.2s, transform 0.2s;
      display: block;
    }

    .nav-text small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
      font-family: 'DM Sans', sans-serif;
    }

    .nav-item:hover .nav-text { color: var(--text); transform: translateX(4px); }
    .nav-item.active .nav-text { color: var(--primary); }

    /* ── MAIN WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 52px 28px 80px;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      text-align: center;
      margin-bottom: 64px;
      animation: fadeUp 0.7s var(--ease) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-eyebrow {
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .page-eyebrow::before, .page-eyebrow::after {
      content: '';
      width: 32px; height: 1px;
      background: var(--primary);
      opacity: 0.5;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 16px;
    }

    .page-title em {
      font-style: normal;
      color: var(--primary);
    }

    .page-sub {
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── CATEGORY SECTION ── */
    .category-section {
      margin-bottom: 64px;
      animation: fadeUp 0.7s var(--ease) both;
    }

    .category-section:nth-child(2) { animation-delay: 0.1s; }
    .category-section:nth-child(3) { animation-delay: 0.2s; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .category-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .cat-tech .category-icon {
      background: rgba(79,142,247,0.12);
      border: 1px solid rgba(79,142,247,0.25);
    }

    .cat-nontech .category-icon {
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .category-info { flex: 1; }

    .category-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cat-tech .category-name { color: var(--tech); }
    .cat-nontech .category-name { color: var(--nontech); }

    .category-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .category-count {
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 5px 14px;
      border-radius: 20px;
    }

    .cat-tech .category-count {
      background: rgba(79,142,247,0.1);
      color: var(--tech);
      border: 1px solid rgba(79,142,247,0.2);
    }

    .cat-nontech .category-count {
      background: rgba(168,85,247,0.1);
      color: var(--nontech);
      border: 1px solid rgba(168,85,247,0.2);
    }

    /* ── EVENTS GRID ── */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    /* ── EVENT CARD ── */
    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      cursor: default;
      opacity: 0;
      transform: translateY(20px);
      transition: border-color 0.3s var(--ease), background 0.3s var(--ease), transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
    }

    .event-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Top accent line */
    .event-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .cat-tech .event-card::before {
      background: linear-gradient(90deg, var(--tech), var(--primary));
    }

    .cat-nontech .event-card::before {
      background: linear-gradient(90deg, var(--nontech), #e879f9);
    }

    .event-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .cat-tech .event-card:hover { border-color: rgba(79,142,247,0.4); background: rgba(79,142,247,0.04); }
    .cat-nontech .event-card:hover { border-color: rgba(168,85,247,0.4); background: rgba(168,85,247,0.04); }
    .event-card:hover::before { opacity: 1; }

    /* Card top row */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .event-name {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.2;
    }

    .event-badges {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .badge {
      font-family: 'Syne', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-solo   { background: rgba(0,229,190,0.1); color: #00e5be; border: 1px solid rgba(0,229,190,0.2); }
    .badge-group  { background: rgba(251,191,36,0.1); color: var(--warn); border: 1px solid rgba(251,191,36,0.2); }
    .badge-team   { background: rgba(255,255,255,0.06); color: var(--label); border: 1px solid var(--border); }

    .event-desc {
      font-size: 13px;
      color: var(--label);
      line-height: 1.7;
      font-weight: 300;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .footer-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
    }

    .cat-tech .footer-dot    { background: var(--tech); }
    .cat-nontech .footer-dot { background: var(--nontech); }

    /* ── SKELETON ── */
    .skeleton-section { margin-bottom: 56px; animation: fadeUp 0.5s var(--ease) both; }

    .skeleton-header {
      height: 56px;
      background: var(--surface);
      border-radius: 12px;
      margin-bottom: 24px;
      overflow: hidden;
      position: relative;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .skeleton-card {
      height: 160px;
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    .skeleton-header::after, .skeleton-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    /* ── EMPTY / ERROR ── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }

    .empty-state p { font-size: 14px; margin-top: 8px; }

    .retry-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: rgba(0,198,255,0.1);
      color: var(--primary);
      border: 1px solid rgba(0,198,255,0.25);
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-btn:hover { background: rgba(0,198,255,0.2); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .page-title { font-size: 32px; }
      .events-grid { grid-template-columns: 1fr; }
      .wrapper { padding: 40px 16px 60px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="menu-toggle" id="menuToggle">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
  <div class="logo" id="navLogo">Symposium <span>2026</span></div>
</header>

<!-- SIDE MENU -->
<nav id="sideMenu" class="nav-overlay">
  <div class="overlay-content">
    <a href="index.html" class="nav-item">
      <span class="nav-number">01</span>
      <div class="nav-text">Home <small>Landing Page</small></div>
    </a>
    <a href="student-details.html" class="nav-item">
      <span class="nav-number">02</span>
      <div class="nav-text">Registration <small>Step 1</small></div>
    </a>
    <a href="about-events.html" class="nav-item active">
      <span class="nav-number">03</span>
      <div class="nav-text">About Events <small>Details</small></div>
    </a>
    <a href="view-registration.html" class="nav-item">
      <span class="nav-number">04</span>
      <div class="nav-text">My History <small>View Entry</small></div>
    </a>
    <a href="contact.html" class="nav-item">
      <span class="nav-number">05</span>
      <div class="nav-text">Contact Us <small>Get in Touch</small></div>
    </a>
  </div>
</nav>

<!-- MAIN -->
<main class="wrapper">

  <div class="page-header">
    <div class="page-eyebrow">Symposium 2026</div>
    <h1 class="page-title">Event <em>Catalog</em></h1>
    <p class="page-sub">Explore all technical and non-technical competitions and challenges</p>
  </div>

  <!-- Content injected by JS -->
  <div id="eventsContent">
    <!-- Skeleton -->
    <div class="skeleton-section">
      <div class="skeleton-header"></div>
      <div class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
    <div class="skeleton-section" style="animation-delay:0.1s;">
      <div class="skeleton-header"></div>
      <div class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </div>

</main>

<script>
  const API_BASE_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://login-system-1-nowr.onrender.com';

  /* ── NAV MENU ── */
  const menuToggle = document.getElementById("menuToggle");
  const sideMenu   = document.getElementById("sideMenu");

  menuToggle.addEventListener("click", e => {
    e.stopPropagation();
    sideMenu.classList.toggle("open");
    menuToggle.classList.toggle("open");
  });

  document.addEventListener("click", e => {
    if (sideMenu.classList.contains("open") && !sideMenu.contains(e.target) && !menuToggle.contains(e.target)) {
      sideMenu.classList.remove("open");
      menuToggle.classList.remove("open");
    }
  });

  /* ── NAVBAR TITLE ── */
  async function loadNavbarTitle() {
    const logoEl = document.getElementById('navLogo');
    logoEl.classList.add('loading');
    try {
      const res  = await fetch(`${API_BASE_URL}/api/public-settings`);
      const data = await res.json();
      if (data?.symposium_title) {
        const parts = data.symposium_title.split(/(\d{2,4})/);
        logoEl.innerHTML = parts.length >= 2
          ? `${parts[0].trim()} <span>${parts[1].trim()}</span>`
          : data.symposium_title;
      }
    } catch {}
    logoEl.classList.remove('loading');
  }

  /* ── BUILD CARD HTML ── */
  function buildCard(event, catClass) {
    const isGroup  = event.event_type === 'group';
    const teamSize = event.max_team_size || 1;
    const typeBadge = isGroup
      ? `<span class="badge badge-group">Group · ${teamSize}</span>`
      : `<span class="badge badge-solo">Solo</span>`;

    return `
      <div class="event-card">
        <div class="card-top">
          <div class="event-name">${event.event_name}</div>
          <div class="event-badges">${typeBadge}</div>
        </div>
        <div class="event-desc">${event.description || 'No description available.'}</div>
        <div class="card-footer">
          <div class="footer-item">
            <div class="footer-dot"></div>
            ${catClass === 'cat-tech' ? 'Technical' : 'Non-Technical'}
          </div>
          ${isGroup ? `<div class="footer-item"><span class="badge badge-team">Max ${teamSize} members</span></div>` : ''}
        </div>
      </div>`;
  }

  /* ── BUILD SECTION HTML ── */
  function buildSection(catClass, icon, title, desc, events) {
    if (events.length === 0) return '';

    const countLabel = `${events.length} Event${events.length !== 1 ? 's' : ''}`;
    const cardsHtml  = events.map(e => buildCard(e, catClass)).join('');

    return `
      <div class="category-section ${catClass}">
        <div class="category-header">
          <div class="category-icon">${icon}</div>
          <div class="category-info">
            <div class="category-name">${title}</div>
            <div class="category-desc">${desc}</div>
          </div>
          <div class="category-count">${countLabel}</div>
        </div>
        <div class="events-grid">${cardsHtml}</div>
      </div>`;
  }

  /* ── STAGGER ANIMATION ── */
  function staggerCards() {
    document.querySelectorAll('.event-card').forEach((card, i) => {
      setTimeout(() => card.classList.add('show'), i * 80);
    });
  }

  /* ── LOAD EVENTS ── */
  async function loadEvents() {
    const content = document.getElementById("eventsContent");
    try {
      const res    = await fetch(`${API_BASE_URL}/events`);
      if (!res.ok) throw new Error("Server error");
      const events = await res.json();

      if (!events || events.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div style="font-size:40px;">📭</div>
            <p>No events have been added yet.</p>
          </div>`;
        return;
      }

      const technical    = events.filter(e => (e.event_category || 'technical') === 'technical');
      const nonTechnical = events.filter(e => e.event_category === 'non-technical');

      const techHTML    = buildSection('cat-tech',    '⚡', 'Technical Events',     'Coding, engineering & innovation challenges', technical);
      const nonTechHTML = buildSection('cat-nontech', '🎨', 'Non-Technical Events', 'Creative, cultural & talent competitions',    nonTechnical);

      content.innerHTML = techHTML + nonTechHTML;
      staggerCards();

    } catch (err) {
      console.error(err);
      content.innerHTML = `
        <div class="empty-state">
          <div style="font-size:40px;">⚠️</div>
          <p>Failed to load events. Please check your connection.</p>
          <button class="retry-btn" onclick="loadEvents()">Retry</button>
        </div>`;
    }
  }

  loadNavbarTitle();
  loadEvents();
</script>
</body>
</html>
