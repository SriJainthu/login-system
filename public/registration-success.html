<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Successful | Symposium 2026</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: radial-gradient(circle at top right, #2c5364, #203a43, #0f2027);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 12px;
  box-sizing: border-box;
}

/* Container */
.container {
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(15px);
  padding: 28px 20px;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.4);
  text-align: center;
}

/* Progress bar fix */
.progress {
  display: flex;
  justify-content: space-between;
  margin-bottom: 25px;
  position: relative;
}

.progress::before,
.progress::after {
  left: 10%;
  width: 80%;
}

/* Circle */
.circle {
  width: 26px;
  height: 26px;
  line-height: 26px;
  font-size: 12px;
}

/* Text */
h2 {
  font-size: 1.3rem;
}

p {
  font-size: 13px;
  padding: 0;
}

/* Buttons */
.primary-btn {
  padding: 14px;
  font-size: 13px;
  border-radius: 10px;
}

.outline-btn {
  padding: 12px;
  font-size: 12px;
}

/* Footer text */
.container div[style] {
  font-size: 10px !important;
}

/* 📱 Extra Mobile Optimization */
@media (max-width: 400px) {

  .container {
    padding: 24px 16px;
  }

  h2 {
    font-size: 1.2rem;
  }

  .success-icon {
    font-size: 48px;
  }

  .label {
    font-size: 8px;
  }

  .circle {
    width: 24px;
    height: 24px;
    line-height: 24px;
  }

  .primary-btn {
    padding: 12px;
  }
}
</style>
</head>
<body>

<div id="confetti-wrapper"></div>

<div class="container">

  <div class="progress">
    <div class="step">
      <div class="circle">✓</div>
      <div class="label">Student</div>
    </div>
    <div class="step">
      <div class="circle">✓</div>
      <div class="label">Events</div>
    </div>
    <div class="step active">
      <div class="circle">3</div>
      <div class="label">Confirm</div>
    </div>
  </div>

  <div class="success-icon">✦</div>
  <h2>Registration <span>Successful</span></h2>
  <p>Your details and event selections have been securely recorded. You can see your live status of team members</p>

  <div class="btn-group">
    <button class="primary-btn" onclick="window.location.href='view-registration.html'">
      🎟️ See Live
    </button>

    <a href="student-details.html" class="outline-btn">
      Register Another Participant
    </a>
  </div>

  <div style="margin-top: 25px; font-size: 11px; color: #888; line-height: 1.5;">
    A confirmation message has been sent to your <br>
    WhatsApp number: <span id="masked-phone" style="color: var(--accent); font-weight: bold;">Updating...</span>
</div>

</div>
<script>
  // Helper to mask phone (e.g., 9687451243 -> 96*****43)
  function maskPhone(phone) {
    if (!phone) return "your number";
    const str = phone.toString();
    return str.slice(0, 2) + "*****" + str.slice(-2);
  }

  function displayRegistrationInfo() {
    // Retrieve the data we saved in the previous step
    const studentData = JSON.parse(localStorage.getItem("studentData"));
    const phoneDisplay = document.getElementById('masked-phone');

    if (studentData && studentData.phone) {
      phoneDisplay.textContent = maskPhone(studentData.phone);
    } else {
      phoneDisplay.textContent = "your registered number";
    }

    // Optional: Clear localStorage if you don't want the data 
    // to persist after the user sees this page
    // localStorage.removeItem("studentData"); 
  }

  // Simple Confetti Generator
  function createConfetti() {
    const wrapper = document.getElementById('confetti-wrapper');
    const colors = ['#00c6ff', '#00ffae', '#ffffff', '#0072ff'];
    
    for (let i = 0; i < 40; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + 'vw';
      conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      conf.style.animationDelay = Math.random() * 2 + 's';
      conf.style.width = Math.random() * 8 + 5 + 'px';
      conf.style.height = conf.style.width;
      wrapper.appendChild(conf);
    }
  }

  window.onload = () => {
    createConfetti();
    displayRegistrationInfo();
  };
</script>

</body>
</html>
