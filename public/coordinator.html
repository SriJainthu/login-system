<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #05080d;
            --surface: #0a0f18;
            --panel:   #0f1520;
            --border:  rgba(255,255,255,0.06);
            --accent:  #00e5be;
            --accent2: #4f8ef7;
            --danger:  #ff4d6d;
            --warn:    #fbbf24;
            --text:    #eaf0fb;
            --muted:   #4a5a72;
            --label:   #8899b0;
            --r:       14px;
            --r-lg:    22px;
            --ease:    cubic-bezier(0.23,1,0.32,1);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            position: sticky; top: 0; z-index: 100;
            height: 62px; padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(5,8,13,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-left { display: flex; align-items: center; gap: 14px; }

        .event-badge {
            font-size: 11px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: rgba(0,229,190,0.1);
            border: 1px solid rgba(0,229,190,0.25);
            color: var(--accent);
            padding: 6px 14px; border-radius: 20px;
        }

        .topbar-title {
            font-size: 15px; font-weight: 700;
            letter-spacing: 0.5px; color: var(--text);
        }

        .topbar-title span { color: var(--accent); }

        .live-dot {
            display: flex; align-items: center; gap: 7px;
            font-size: 10px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--accent);
        }

        .live-dot::before {
            content: ''; width: 7px; height: 7px;
            border-radius: 50%; background: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%  { box-shadow: 0 0 0 0 rgba(0,229,190,0.6); }
            70% { box-shadow: 0 0 0 8px rgba(0,229,190,0); }
            100%{ box-shadow: 0 0 0 0 rgba(0,229,190,0); }
        }

        .btn-logout {
            font-size: 10px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: transparent; color: var(--label);
            border: 1px solid var(--border); border-radius: var(--r);
            padding: 8px 18px; cursor: pointer; transition: 0.3s;
        }

        .btn-logout:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

        /* WRAPPER */
        .wrapper {
            max-width: 1300px; margin: 0 auto;
            padding: 36px 28px 64px;
            display: flex; flex-direction: column; gap: 24px;
        }

        /* STAT ROW */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 24px 28px;
        }

        .stat-label {
            font-size: 10px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--muted); margin-bottom: 10px;
        }

        .stat-value {
            font-size: 40px; font-weight: 800;
            letter-spacing: -2px; color: var(--accent);
            line-height: 1;
        }

        .stat-value.plain { color: var(--text); font-size: 22px; }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 28px;
        }

        .card-header {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 22px; padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--accent);
        }

        /* FILTER ROW */
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto;
            gap: 10px; align-items: end;
        }

        .fg { display: flex; flex-direction: column; gap: 6px; }

        .fg-label {
            font-size: 9px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--muted);
        }

        input, select {
            font-family: inherit; font-size: 13px;
            color: var(--text); background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--r); padding: 10px 14px;
            width: 100%; outline: none; transition: 0.25s;
        }

        input::placeholder { color: var(--muted); }
        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,229,190,0.08);
        }

        select option { background: var(--panel); }

        .btn {
            font-size: 10px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            border: none; border-radius: var(--r);
            padding: 11px 20px; cursor: pointer;
            transition: 0.3s; white-space: nowrap;
            display: inline-flex; align-items: center;
            justify-content: center; gap: 7px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00c9a7);
            color: #05080d;
        }

        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-success {
            background: rgba(0,229,190,0.1); color: var(--accent);
            border: 1px solid rgba(0,229,190,0.25);
        }

        .btn-success:hover { background: rgba(0,229,190,0.18); transform: translateY(-1px); }

        .btn-blue {
            background: rgba(79,142,247,0.1); color: var(--accent2);
            border: 1px solid rgba(79,142,247,0.25);
        }

        .btn-blue:hover { background: rgba(79,142,247,0.18); transform: translateY(-1px); }

        /* EXPORT SECTION */
        .export-row {
            display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 12px;
            margin-top: 4px;
        }

        .checkbox-group {
            display: flex; flex-wrap: wrap; gap: 8px;
        }

        .checkbox-item {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; color: var(--label);
            padding: 6px 12px; border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--panel); cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-item:hover { border-color: rgba(0,229,190,0.2); color: var(--text); }
        .checkbox-item input { width: 13px; height: 13px; accent-color: var(--accent); }

        .export-btns { display: flex; gap: 8px; }

        /* TABLE */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg); overflow: hidden;
        }

        .table-toolbar {
            padding: 16px 26px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between;
        }

        .table-toolbar-title {
            font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--accent);
        }

        .table-count { font-size: 10px; color: var(--muted); }

        .table-scroll { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }

        thead th {
            background: var(--panel);
            font-size: 9px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--muted); padding: 14px 20px;
            text-align: left; border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody td {
            padding: 14px 20px; font-size: 13px;
            color: var(--text); border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.02); }
        tbody tr { animation: rowIn 0.35s var(--ease) backwards; }

        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        td[rowspan] {
            background: rgba(0,229,190,0.04) !important;
            border-right: 1px solid rgba(0,229,190,0.15);
            font-size: 10px; font-weight: 700;
            color: var(--accent); vertical-align: middle;
        }

        .td-mono { font-family: monospace; font-size: 12px; color: var(--label); }
        .td-name { font-weight: 600; }

        .level-pill {
            display: inline-block; font-size: 9px; font-weight: 700;
            letter-spacing: 1px; padding: 3px 8px; border-radius: 4px;
        }

        .level-ug { background: rgba(0,229,190,0.1); color: var(--accent); border: 1px solid rgba(0,229,190,0.2); }
        .level-pg { background: rgba(79,142,247,0.1); color: var(--accent2); border: 1px solid rgba(79,142,247,0.2); }

        /* TOAST */
        #toast {
            position: fixed; bottom: 28px; right: 28px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            padding: 13px 20px; border-radius: var(--r);
            background: var(--surface);
            border: 1px solid rgba(0,229,190,0.3);
            color: var(--accent);
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            z-index: 9999; pointer-events: none;
            opacity: 0; transform: translateY(16px);
            transition: all 0.4s var(--ease);
        }

        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .filter-row { grid-template-columns: 1fr 1fr; }
            .filter-row .btn { grid-column: span 2; }
            .stats-row { grid-template-columns: 1fr; }
        }
        .coord-name {
            -webkit-text-fill-color: var(--accent);
    color: var(--accent);
    font-weight: 800;
    position: relative;
}

.coord-name::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 100%;
    height: 2px;

    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;

    animation: underlineGrow 0.8s ease forwards;
    animation-delay: 0.5s;
}

@keyframes underlineGrow {
    to {
        transform: scaleX(1);
    }
}
.welcome-msg {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
    margin-top: 4px;

    opacity: 0;
    transform: translateY(12px);

    animation: welcomeFadeIn 1s var(--ease) forwards;

    background: linear-gradient(
        90deg,
        var(--text),
        var(--accent),
        var(--text)
    );
    background-size: 200% auto;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation:
        welcomeFadeIn 1s var(--ease) forwards,
        welcomeGlow 4s linear infinite;
}

@keyframes welcomeFadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes welcomeGlow {
    0% {
        background-position: 0% center;
    }
    100% {
        background-position: 200% center;
    }
}
    </style>
</head>
<body>

<!-- Instant auth guard — prevents flash -->
<style>#page-guard { display:none; }</style>
<script>
    if (!sessionStorage.getItem("coordToken") || !sessionStorage.getItem("coordEvent")) {
        window.location.replace("coordinator-login.html");
    }
</script>

<div id="toast"></div>
<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
       <div style="display:flex; flex-direction:column; gap:2px;">
    <div class="topbar-title" id="topbarTitle">Coordinator <span>Dashboard</span></div>
    <div id="welcomeMsg" style="font-size:11px; color:var(--muted); letter-spacing:0.5px;"></div>
</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
        <span class="live-dot">Live</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</header>

<!-- MAIN -->
<main class="wrapper">

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Participants</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Event Name</div>
            <div class="stat-value plain" id="statEvent">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Event Type</div>
            <div class="stat-value plain" id="statType">—</div>
        </div>
    </div>
<!-- Replace the third stat-card: -->
<div class="stat-card">
    <div class="stat-label">Capacity</div>
    <div class="stat-value plain" id="statCapacity">— / —</div>
    <div id="capacityBar" style="margin-top:12px; height:5px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; display:none;">
        <div id="capacityFill" style="height:100%; width:0%; background:var(--accent); border-radius:4px; transition:width 0.6s;"></div>
    </div>
</div>
    <!-- FILTERS + EXPORT -->
    <div class="card" id="filterCard">
        <div class="card-header">
            <span class="card-title">Filter Participants</span>
        </div>

        <!-- Solo filters — shown for solo events -->
        <div id="soloFilters">
            <div class="filter-row">
                <div class="fg">
                    <label class="fg-label">College</label>
                    <input type="text" id="filterCollege" placeholder="All Colleges">
                </div>
                <div class="fg">
                    <label class="fg-label">Department</label>
                    <select id="filterDept">
                        <option value="">All Departments</option>
                    </select>
                </div>
                <div class="fg">
                    <label class="fg-label">Degree</label>
                    <select id="filterDegree">
                        <option value="">All Degrees</option>
                    </select>
                </div>
                <div class="fg">
                    <label class="fg-label">Level</label>
                    <select id="filterLevel">
                        <option value="">All Levels</option>
                        <option value="UG">UG</option>
                        <option value="PG">PG</option>
                    </select>
                </div>
                <div class="fg">
                    <label class="fg-label">Year</label>
                    <select id="filterYear">
                        <option value="">All Years</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="loadStudents()">Apply</button>
            </div>
        </div>

        <!-- Group filter — shown for group events -->
        <div id="groupFilters" style="display:none;">
            <div style="display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end;">
                <div class="fg">
                    <label class="fg-label">Filter by College</label>
                    <input type="text" id="filterGroupCollege" placeholder="All Colleges">
                </div>
                <button class="btn btn-primary" onclick="loadStudents()">Apply</button>
            </div>
        </div>

        <!-- Export -->
        <div style="margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border);">
            <div class="export-row">
                <div class="checkbox-group" id="exportCheckboxes">
                    <label class="checkbox-item"><input type="checkbox" id="ex-name" checked> Name</label>
                    <label class="checkbox-item"><input type="checkbox" id="ex-reg" checked> Reg No</label>
                    <label class="checkbox-item"><input type="checkbox" id="ex-college" checked> College</label>
                    <label class="checkbox-item"><input type="checkbox" id="ex-dept" checked> Dept</label>
                    <label class="checkbox-item"><input type="checkbox" id="ex-degree" checked> Degree</label>
                    <label class="checkbox-item"><input type="checkbox" id="ex-level" checked> Level</label>
                    <label class="checkbox-item"><input type="checkbox" id="ex-year" checked> Year</label>
                </div>
                <div class="export-btns">
                    <button class="btn btn-success" onclick="exportCSV()">⬇ CSV</button>
                    <button class="btn btn-blue"    onclick="exportPDF()">📄 PDF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
        <div class="table-toolbar">
            <span class="table-toolbar-title">Participants</span>
            <span class="table-count" id="tableCount">— records</span>
        </div>
        <div class="table-scroll">
            <table id="mainTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

</main>

<script>
// Auth check
const coordToken = sessionStorage.getItem("coordToken");
const coordEvent = sessionStorage.getItem("coordEvent");
const coordType  = sessionStorage.getItem("coordType");
sessionStorage.setItem("coordLimit", data.participant_limit ?? "");
sessionStorage.setItem("coordCount", data.participant_count ?? 0);


const API_BASE_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://login-system-1-nowr.onrender.com';

const isGroup = coordType === "group";

// Safe init — no crash
document.getElementById("statEvent").textContent = coordEvent || "—";
document.getElementById("statType").textContent  = isGroup ? "Group Event" : "Solo Event";

// ✅ Welcome message
const coordName = sessionStorage.getItem("coordName") || "";
const welcomeEl = document.getElementById("welcomeMsg");
if (welcomeEl) {
   welcomeEl.innerHTML = coordName
    ? `Welcome, <span class="coord-name">${coordName}</span> 👋`
    : `Welcome, <span class="coord-name">Coordinator</span> 👋`;
}

if (isGroup) {
    document.getElementById("soloFilters").style.display  = "none";
    document.getElementById("groupFilters").style.display = "block";
    // Hide individual export checkboxes not relevant to group view
}

function coordFetch(url) {
    return fetch(url, {
        headers: { "Authorization": `Bearer ${coordToken}` }
    }).then(res => {
        if (res.status === 401 || res.status === 403) {
            sessionStorage.clear();
            window.location.href = "coordinator-login.html";
        }
        return res;
    });
}

// Populate filter dropdowns
async function populateFilters() {
    try {
        const [deptRes, degRes, yearRes] = await Promise.all([
            fetch(`${API_BASE_URL}/api/departments`),
            fetch(`${API_BASE_URL}/api/degrees`),
            fetch(`${API_BASE_URL}/api/year-settings`)
        ]);
        const depts   = await deptRes.json();
        const degrees = await degRes.json();
        const years   = await yearRes.json();

        // Departments
        const deptSel = document.getElementById("filterDept");
        depts.forEach(d => {
            const o = document.createElement("option");
            o.value = d.name; o.textContent = d.name;
            deptSel.appendChild(o);
        });

        // Degrees grouped
        const degSel = document.getElementById("filterDegree");
        const ug = degrees.filter(d => d.level === "UG");
        const pg = degrees.filter(d => d.level === "PG");
        if (ug.length) {
            const og = document.createElement("optgroup"); og.label = "UG";
            ug.forEach(d => { const o = document.createElement("option"); o.value=d.name; o.textContent=d.name; og.appendChild(o); });
            degSel.appendChild(og);
        }
        if (pg.length) {
            const og = document.createElement("optgroup"); og.label = "PG";
            pg.forEach(d => { const o = document.createElement("option"); o.value=d.name; o.textContent=d.name; og.appendChild(o); });
            degSel.appendChild(og);
        }

        // Years
        const yearSel = document.getElementById("filterYear");
        const maxYears = Math.max(...years.map(y => y.max_years));
        for (let i = 1; i <= maxYears; i++) {
            const o = document.createElement("option");
            o.value = i; o.textContent = `Year ${i}`;
            yearSel.appendChild(o);
        }

        // Update year on level change
        document.getElementById("filterLevel").addEventListener("change", () => {
            const level = document.getElementById("filterLevel").value;
            const yearSel = document.getElementById("filterYear");
            yearSel.value = "";
            const setting = years.find(y => y.level === level);
            const max = setting ? setting.max_years : maxYears;
            yearSel.innerHTML = '<option value="">All Years</option>';
            for (let i = 1; i <= max; i++) {
                const o = document.createElement("option");
                o.value = i; o.textContent = `Year ${i}`;
                yearSel.appendChild(o);
            }
        });

    } catch(e) { console.error("Filter load error:", e); }
}

// Load students
let currentData = { type: "solo", data: [] };

async function loadStudents() {
    const params = new URLSearchParams();
    if (isGroup) {
        const college = document.getElementById("filterGroupCollege").value;
        if (college) params.set("college", college);
    } else {
        const college = document.getElementById("filterCollege").value;
        const dept    = document.getElementById("filterDept").value;
        const degree  = document.getElementById("filterDegree").value;
        const level   = document.getElementById("filterLevel").value;
        const year    = document.getElementById("filterYear").value;
        if (college) params.set("college", college);
        if (dept)    params.set("department", dept);
        if (degree)  params.set("degree", degree);
        if (level)   params.set("level", level);
        if (year)    params.set("year", year);
    }

    try {
        const res  = await coordFetch(`${API_BASE_URL}/coordinator/students?${params}`);
        const data = await res.json();
        currentData = data;

        if (data.type === "group") renderGroupTable(data.data);
        else                       renderSoloTable(data.data);
    } catch(e) {
        showToast("✗ Failed to load participants");
    }
}

function renderSoloTable(rows) {
    document.getElementById("tableHead").innerHTML = `
        <tr>
            <th>Student Name</th><th>Register No</th><th>College</th>
            <th>Department</th><th>Degree</th><th>Level</th><th>Year</th>
        </tr>`;
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    rows.forEach((s, i) => {
        const tr = tbody.insertRow();
        tr.style.animationDelay = (i * 0.025) + "s";
        const levelHtml = s.level
            ? `<span class="level-pill level-${s.level.toLowerCase()}">${s.level}</span>`
            : "—";
        tr.innerHTML = `
            <td class="td-name">${s.name}</td>
            <td class="td-mono">${s.reg_no}</td>
            <td>${s.college}</td>
            <td>${s.department}</td>
            <td>${s.degree || "—"}</td>
            <td>${levelHtml}</td>
            <td class="td-mono">${s.year}</td>`;
    });
    updateCount(rows.length);
}

function renderGroupTable(grouped) {
    document.getElementById("tableHead").innerHTML = `
        <tr>
            <th>Team Token</th><th>Team No</th><th>Register No</th>
            <th>Name</th><th>Department</th><th>College</th>
        </tr>`;
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    let total = 0, teamN = 1;
    Object.keys(grouped).forEach(tok => {
        const members = grouped[tok];
        total += members.length;
        members.forEach((m, i) => {
            const tr = tbody.insertRow();
            tr.innerHTML = `
                ${i===0 ? `<td rowspan="${members.length}"><b>${tok}</b></td>` : ""}
                ${i===0 ? `<td rowspan="${members.length}" style="text-align:center;">Team_${teamN}</td>` : ""}
                <td class="td-mono">${m.reg_no}</td>
                <td class="td-name">${m.name}</td>
                <td>${m.department}</td>
                <td>${m.college}</td>`;
        });
        teamN++;
    });
    updateCount(total);
}

function updateCount(n) {
    document.getElementById("statTotal").textContent = n;
    document.getElementById("tableCount").textContent = `${n} record${n !== 1 ? "s" : ""}`;
}

function exportCSV() {
    const rows = document.getElementById("tableBody").querySelectorAll("tr");
    if (!rows.length) return showToast("No data to export");
    const p = {
        name:   document.getElementById("ex-name").checked,
        reg:    document.getElementById("ex-reg").checked,
        college:document.getElementById("ex-college").checked,
        dept:   document.getElementById("ex-dept").checked,
        degree: document.getElementById("ex-degree").checked,
        level:  document.getElementById("ex-level").checked,
        year:   document.getElementById("ex-year").checked
    };

    let csv = "";
    if (isGroup) {
        csv = "TEAM TOKEN,TEAM NO,REG NO,NAME,DEPT,COLLEGE\n";
        rows.forEach(row => {
            const cells = Array.from(row.cells);
            const isLeader = cells.length > 4;
            if (isLeader) {
                csv += `"${cells[0].innerText}","${cells[1].innerText}","${cells[2].innerText}","${cells[3].innerText}","${cells[4].innerText}","${cells[5].innerText}"\n`;
            } else {
                csv += `"","","${cells[0].innerText}","${cells[1].innerText}","${cells[2].innerText}","${cells[3].innerText}"\n`;
            }
        });
    } else {
        const headers = [];
        if(p.name)   headers.push("NAME");
        if(p.reg)    headers.push("REG NO");
        if(p.college)headers.push("COLLEGE");
        if(p.dept)   headers.push("DEPT");
        if(p.degree) headers.push("DEGREE");
        if(p.level)  headers.push("LEVEL");
        if(p.year)   headers.push("YEAR");
        csv = headers.join(",") + "\n";
        rows.forEach(row => {
            const cells = Array.from(row.cells);
            const rowData = [];
            if(p.name)   rowData.push(`"${cells[0]?.innerText||""}"`);
            if(p.reg)    rowData.push(`"${cells[1]?.innerText||""}"`);
            if(p.college)rowData.push(`"${cells[2]?.innerText||""}"`);
            if(p.dept)   rowData.push(`"${cells[3]?.innerText||""}"`);
            if(p.degree) rowData.push(`"${cells[4]?.innerText||""}"`);
            if(p.level)  rowData.push(`"${cells[5]?.innerText||""}"`);
            if(p.year)   rowData.push(`"${cells[6]?.innerText||""}"`);
            csv += rowData.join(",") + "\n";
        });
    }

    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    a.download = `${coordEvent}_${new Date().toLocaleDateString()}.csv`;
    a.click();
    showToast("✓ CSV downloaded");
}

function exportPDF() {
    const rows = document.getElementById("tableBody").querySelectorAll("tr");
    if (!rows.length) return showToast("No data to export");

    const p = {
        name:   document.getElementById("ex-name").checked,
        reg:    document.getElementById("ex-reg").checked,
        college:document.getElementById("ex-college").checked,
        dept:   document.getElementById("ex-dept").checked,
        degree: document.getElementById("ex-degree").checked,
        level:  document.getElementById("ex-level").checked,
        year:   document.getElementById("ex-year").checked
    };

    let tbl = `<table border="1"><thead><tr>`;

    if (isGroup) {
        tbl += `<th>Team Token</th><th>Team No</th><th>Reg No</th><th>Name</th><th>Dept</th><th>College</th>`;
    } else {
        if(p.name)   tbl += `<th>Name</th>`;
        if(p.reg)    tbl += `<th>Reg No</th>`;
        if(p.college)tbl += `<th>College</th>`;
        if(p.dept)   tbl += `<th>Dept</th>`;
        if(p.degree) tbl += `<th>Degree</th>`;
        if(p.level)  tbl += `<th>Level</th>`;
        if(p.year)   tbl += `<th>Year</th>`;
    }

    tbl += `</tr></thead><tbody>`;

    rows.forEach(row => {
        const cells = Array.from(row.cells);
        tbl += `<tr>`;
        if (isGroup) {
            // Group view — export all columns as-is
            const isLeader = cells.length > 4;
            if (isLeader) {
                tbl += `<td>${cells[0].innerText}</td><td>${cells[1].innerText}</td><td>${cells[2].innerText}</td><td>${cells[3].innerText}</td><td>${cells[4].innerText}</td><td>${cells[5].innerText}</td>`;
            } else {
                tbl += `<td></td><td></td><td>${cells[0].innerText}</td><td>${cells[1].innerText}</td><td>${cells[2].innerText}</td><td>${cells[3].innerText}</td>`;
            }
        } else {
            // Solo view — respect checkboxes
            // Table columns: Name(0), Reg(1), College(2), Dept(3), Degree(4), Level(5), Year(6)
            if(p.name)   tbl += `<td>${cells[0]?.innerText||''}</td>`;
            if(p.reg)    tbl += `<td>${cells[1]?.innerText||''}</td>`;
            if(p.college)tbl += `<td>${cells[2]?.innerText||''}</td>`;
            if(p.dept)   tbl += `<td>${cells[3]?.innerText||''}</td>`;
            if(p.degree) tbl += `<td>${cells[4]?.innerText||''}</td>`;
            if(p.level)  tbl += `<td>${cells[5]?.innerText||''}</td>`;
            if(p.year)   tbl += `<td>${cells[6]?.innerText||''}</td>`;
        }
        tbl += `</tr>`;
    });

    tbl += `</tbody></table>`;

    const w = window.open("", "", "height=800,width=1000");
    w.document.write(`
        <html><head><title>${coordEvent}</title>
        <style>
            body { font-family: sans-serif; padding: 20px; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ccc; padding: 8px; font-size: 12px; }
            th { background: #f0f0f0; }
            h2, h3 { text-align: center; }
        </style></head>
        <body>
            <h2>${coordEvent}</h2>
            <h3>Participant List</h3>
            ${tbl}
        </body></html>`);
    w.document.close();
    setTimeout(() => { w.print(); w.close(); }, 500);
    showToast("✓ PDF ready");
}

function logout() {
    sessionStorage.removeItem("coordToken");
    sessionStorage.removeItem("coordEvent");
    sessionStorage.removeItem("coordType");
    sessionStorage.removeItem("coordName");
    window.location.href = "coordinator-login.html";
}
async function loadEventInfo() {
    try {
        const res  = await coordFetch(`${API_BASE_URL}/coordinator/event-info`);
        const data = await res.json();
        const limit = data.participant_limit;
        const count = data.participant_count;
        const capEl  = document.getElementById("statCapacity");
        const barEl  = document.getElementById("capacityBar");
        const fillEl = document.getElementById("capacityFill");
        if (limit === null) {
            capEl.textContent = `${count} / ∞`;
            return;
        }
        const pct = Math.min(100, Math.round((count / limit) * 100));
        capEl.textContent = `${count} / ${limit}`;
        capEl.style.color = count >= limit ? 'var(--danger)' : count/limit >= 0.8 ? 'var(--warn)' : 'var(--accent)';
        barEl.style.display = 'block';
        fillEl.style.width  = pct + '%';
        fillEl.style.background = count >= limit ? 'var(--danger)' : count/limit >= 0.8 ? 'var(--warn)' : 'var(--accent)';
    } catch(e) { console.error("Event info load error:", e); }
}
// Init
populateFilters();
loadStudents();
loadEventInfo();
